<style>
#smiley {
   color: red;
   font-size: 50pt;
   position: absolute;
   left: 0px;
   top: 0px;
   animation-name: move; /* move, move2, ... */
   animation-duration: 4s; /* 1s, 2s, 3s, ... */
   animation-iteration-count: infinite; /* infinite, 1, 2, 3, ... */
   animation-timing-function: ease-in-out; /* linear, ease-in, ease-out, ... */
}

@keyframes move {
   0%   { color:red; left:0px; top:0px; }
   25% { color:yellow; left: 200px; top: 100px; }
   50%  { color:blue; left:200px; top:0px; }
   75% { color:green; top: 100px; left: 0px; }
   100% { color:red; left:0px; top:0px; }

}

</style>

<div id="smiley">&#9786;</div>
