<!DOCTYPE HTML>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Playing Cards</title>
   <link rel="stylesheet" href="styles.css"> // Link to external CSS file (if needed)
   <style>
      /* Table Styles */
      .table {
         width: 400px;
         height: 300px;
         background: linear-gradient(forestgreen, darkgreen);
      }

      /* Card Styles */
      .card {
         background-color: whitesmoke;
         border: 1px solid black;
         width: 100px;
         height: 160px;
         line-height: 160px;
         text-align: center;
         font-size: 80px;
         border-radius: 5px;
         box-shadow: black 3px 3px;
         position: absolute;
      }

      .card-red {
         color: red;
      }

      .card-black {
         color: black;
      }

      .card-top {
         left: 150px;
         top: 100px;
         z-index: 2;
      }

      .card-bottom {
         left: 240px;
         top: 120px;
         z-index: 1;
      }

      /* Suit Styles */
      .heart, .spade {
         font-size: 28px;
         width: 30px;
         height: 30px;
         line-height: 30px;
         position: absolute;
      }

      .heart {
         color: red;
      }

      .spade {
         color: black;
         font-size: 36px;
      }

      /* Positioning for Symbols */
      .top-left {
         left: 2px;
         top: 2px;
      }

      .bottom-right {
         right: 2px;
         bottom: 2px;
      }
   </style>
</head>
<body>
   <div class="table">
      <div class="card card-top card-black">
         A
         <span class="spade top-left">&#9824;</span>
         <span class="spade bottom-right">&#9824;</span>
      </div>
      <div class="card card-bottom card-red">
         5
         <span class="heart top-left">&#10084;</span>
         <span class="heart bottom-right">&#10084;</span>
      </div>
   </div>
</body>
</html>
