<!DOCTYPE HTML>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Buttons</title>
   <style>
    .subscribe-button {
      background-color:rgb(202, 0, 0);
      color:white;
      border: none;
      border-radius: 2px;
      height: 35px;
      cursor: pointer;
      margin-right: 8px;
      font-weight: 550;
      transition: opacity .2s;
      width: 110px;
    }
  
    .subscribe-button:hover {
      opacity: .7;
    }
  
    .subscribe-button:active {
      opacity: .4;
    }
  .tweet-button {
  background-color: rgb(10, 144, 233);
  color: white;
  border: none;
  height: 36px;
  width: 72px;
  border-radius: 18px;
  font-weight: 700;
  font-size: 16px;
  cursor: pointer;
  margin-left: 8px;
  }
  
  .tweet-button:hover {
    opacity: .7;
  }
  
  .tweet-button:active {
    opacity: .4;
  }
  
  .join-button {
  background-color: white;
  border-color: rgb(9, 130, 243);
  border-style: solid;
  border-width: 1px;
  color: rgb(9, 130, 243);
  height: 36px;
  width: 60px;
  border-radius: 2px;
  cursor: pointer;
  transition: background-color 1s,
    color 1s;
  font-weight: 550;
  }
  
  .join-button:hover {
  background-color: rgb(9, 130, 243);
  color: white;
  }
  .join-button:active {
    opacity: .6;
  
  }
  </style>
</head>
<body> 
  <button class="subscribe-button">
    SUBSCRIBE
  </button>
  
  <button class="join-button">
    Join
  </button>
  
  <button class="tweet-button">
    Tweet
  </button>
</body>

</html>
