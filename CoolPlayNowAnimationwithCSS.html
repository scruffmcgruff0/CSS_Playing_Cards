<style>
#welcome {
  font-size: 24px;
  color: #2351b6;
  text-align: center;
  margin-top: 20px;
 animation: spin 1s linear;
}

@keyframes spin {
  0% { transform: translate(-300px); }
  50% { transform: translate( 60px); }
  100% { transform: translate(0px); }
}
.button {
  margin: auto;
   text-align: center;
   vertical-align: middle;
   width: 300px;
   height: 60px; 
   line-height: 60px;   
   font: bold 28pt/150% arial;
   border: solid 2px red;
   box-shadow: 2px 2px 3px;
   border-radius: 10px;   
   background: radial-gradient(white, #bbb);
   transition: all 100ms ease-in-out;
   animation: wiggle 500ms linear 1s 2 reverse; /* 1s delay, 2 iterations, reverse direction */
   cursor: pointer;

}

@keyframes wiggle {
  0% { transform: rotate(0deg); }
  10% { transform: rotate(3deg); }
  20% { transform: rotate(0deg); }
  25% { transform: rotate(3deg); }
  30% { transform: rotate(0deg); }
  35% { transform: rotate(3deg); }
  40% { transform: rotate(3deg); }
  45% { transform: rotate(0deg); }
  50% { transform: rotate(0deg); }
  60% { transform: rotate(-3deg); }
  75% { transform: rotate(-3deg); }
  100% { transform: rotate(0deg); }
}
</style>
<body>
<div id="welcome">Enter the exciting world of Castle Maniacs!</div>
<div class="button">Play Now!</div>
</body>

<!-- translate, scale, rotate, transformation are functions that can be used 
to animate an element's position, size, rotation, and other 
transformations. -->
